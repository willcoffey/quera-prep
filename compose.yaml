volumes:
  pgdata: {}
  pulsardata: {}
services:
  #-------------------- Infrastructure Services --------------------     
  # Gateway, only exposed service. Routes requests to services. Kong=nginx+openresty
  kong:                                      
    image: docker.io/library/kong:3.9
    environment:                             
      KONG_DATABASE: "off"                   
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml  
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_NGINX_PROXY_CLIENT_MAX_BODY_SIZE: "128k"
    volumes:                                 
      - ./kong/kong.yml:/kong/kong.yml:ro    
    ports:                                   
      - "8000:8000"                          
  # Database
  postgres:
    image: docker.io/library/postgres:18
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U postgres
      interval: 2s
      start_period: 20s
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?}
      TASK_MANAGER_DB_PASSWORD: ${TASK_MANAGER_DB_PASSWORD:?}
    volumes:
      # Contains the actual database
      - pgdata:/var/lib/postgresql
      # bind mount pointing to  init scripts, only run when pgdata is empty
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
  # Pulsar
  pulsar:
    image: docker.io/apachepulsar/pulsar:4.0.7
    healthcheck:
      test: curl -f localhost:8080/admin/v2/brokers/ready
      interval: 5s
      start_period: 60s
    command: sh -c "bin/apply-config-from-env.py conf/standalone.conf && exec bin/pulsar standalone -nfw -nss"
    environment:
      PULSAR_MEM: "-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m"
      advertisedAddress: pulsar
    volumes:
      - pulsardata:/pulsar/data

  #-------------------- Application Services --------------------     
  task-manager:
    image: localhost/task-manager:latest
    build:
      context: kotlin
      args:
        SERVICE: task-manager
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_manager
      SPRING_DATASOURCE_USERNAME: task_manager
      SPRING_DATASOURCE_PASSWORD: ${TASK_MANAGER_DB_PASSWORD:?}
      SPRING_PULSAR_CLIENT_SERVICE_URL: pulsar://pulsar:6650
      SPRING_SQL_INIT_MODE: always
    depends_on:
      postgres: { condition: service_healthy, restart: true }
      pulsar:   { condition: service_healthy, restart: true }
    restart: on-failure
  quantum-computer:
    image: localhost/quantum-computer:latest
    build:
      context: kotlin
      args:
        SERVICE: quantum-computer
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SPRING_PULSAR_CLIENT_SERVICE_URL: pulsar://pulsar:6650
    depends_on:
      pulsar:   { condition: service_healthy, restart: true }
    restart: on-failure
