_format_version: "3.0"
services:                          
  - name: task-manager             # identifier; optional, but shows in logs/errors
    url: http://task-manager:8080  # compose service name + container port
    routes:                        # public paths that map to this service
      - paths:                     # prefix match, stripped before proxying
          - /tasks                 # /tasks/foo -> task-manager:8080/foo
  # Statically built react frontend
  - name: frontend                
    url: http://frontend:80
    routes:
      - paths:
          - /                     
        strip_path: false          

